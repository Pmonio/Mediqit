<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0876d7" />
    <title>You’re offline | Mediqit</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f8fc;
        color: #092852;
        font-family: Arial, sans-serif;
      }
      main {
        width: min(100%, 520px);
        padding: 42px 30px;
        text-align: center;
        background: #fff;
        border: 1px solid #dce8f2;
        border-radius: 24px;
        box-shadow: 0 18px 60px rgba(9, 40, 82, 0.1);
      }
      img {
        width: 170px;
        height: auto;
      }
      h1 {
        margin: 30px 0 12px;
        font-size: clamp(2rem, 7vw, 3rem);
      }
      p {
        margin: 0 auto 28px;
        max-width: 390px;
        color: #52667b;
        font-size: 1.05rem;
        line-height: 1.65;
      }
      button {
        min-height: 50px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #ef201c;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/mediqit-wordmark-v1.png" alt="Mediqit" />
      <h1>You’re offline.</h1>
      <p>
        Your saved Mediqit pages are still available. Reconnect to join the
        launch list, contact us or receive the latest updates.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
